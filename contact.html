<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch with Idio Creative for creative collaboration, partnerships, quotes and more.">
    <title>Contact | Idio</title>
    <script defer src="scripts/register-cache.js"></script>
    <link rel="preload" href="assets/fonts/DM_Sans/DMSans-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/fonts/Teva/Teva-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="assets/media/contact/team-field.png" as="image">
    <link rel="stylesheet" href="styles/contact-page.css">
  </head>
  <body class="contact-page">
    <a class="contact-skip-link" href="#contact-email">Skip to contact details</a>
    <header class="services-nav" aria-label="Primary navigation">
      <a class="services-nav__brand" href="index.html" aria-label="Idio home">
        <span class="services-nav__brand-mark" aria-hidden="true"></span>
      </a>
      <button class="services-nav__toggle" type="button" aria-expanded="false" aria-controls="contact-menu">menu</button>
      <nav class="services-nav__links" id="contact-menu" aria-label="Main">
        <a href="services.html">services</a>
        <a href="index.html#case-study-title">projects</a>
        <a href="about.html">about us</a>
        <a href="events.html">events</a>
        <a class="is-active" href="contact.html" aria-current="page">contact</a>
      </nav>
    </header>
    <!-- Figma: SxbrTN0u4TjdTXbc94pYyK / 1891:124. Reference: 1920 × 1167. -->
    <main>
      <section class="contact-hero" aria-labelledby="contact-title">
        <img class="contact-hero__image" src="assets/media/contact/team-field.png" width="4096" height="2731" alt="" aria-hidden="true" fetchpriority="high">
        <p class="contact-hero__intro">whether for creative collaboration, partnership, quotes or more</p>
        <h1 class="contact-hero__title" id="contact-title"><a id="contact-email" href="mailto:idiocreative@outlook.com">idiocreative@outlook.com</a></h1>
        <div class="contact-hero__socials" role="group" aria-label="Find Idio on social media">
          <a class="contact-hero__social" href="https://www.instagram.com/idio_creative/" aria-label="Idio Creative on Instagram"><img src="assets/media/contact/social-instagram.svg" width="35" height="34" alt=""></a>
          <span class="contact-hero__social" role="img" aria-label="Facebook"><img src="assets/media/contact/social-facebook.svg" width="34" height="34" alt=""></span>
          <a class="contact-hero__social" href="https://www.pinterest.com/idiocreative/" aria-label="Idio Creative on Pinterest"><img src="assets/media/contact/social-pinterest.svg" width="35" height="34" alt=""></a>
        </div>
        <div class="contact-hero__accents" aria-hidden="true">
          <div class="contact-hero__accent contact-hero__accent--upper-right"><img src="assets/media/contact/accent-upper-right.svg" alt=""></div>
          <div class="contact-hero__accent contact-hero__accent--right"><img src="assets/media/contact/accent-right.svg" alt=""></div>
          <div class="contact-hero__accent contact-hero__accent--left"><img src="assets/media/contact/accent-left.svg" alt=""></div>
          <div class="contact-hero__accent contact-hero__accent--lower-left"><img src="assets/media/contact/accent-lower-left.svg" alt=""></div>
          <div class="contact-hero__accent contact-hero__accent--bottom-left"><img src="assets/media/contact/accent-bottom-left.svg" alt=""></div>
        </div>
      </section>
    </main>
    <script type="module" src="scripts/contact.js"></script>
  </body>
</html>
